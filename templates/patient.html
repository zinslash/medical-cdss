<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile - AI Triage</title>

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Clinical SaaS Color Palette */
            --bg-color: #F4F7FB;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;

            --primary: #0284C7;
            --primary-hover: #0369A1;
            --primary-light: #E0F2FE;
            --primary-text: #0284C7;

            --border: #E2E8F0;
            --border-hover: #CBD5E1;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);

            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 50px 20px;
            -webkit-font-smoothing: antialiased;

            /* BEAUTIFUL AMBIENT MESH BACKGROUND */
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, #E0F2FE 0px, transparent 50%),
                radial-gradient(at 100% 0%, #F0F9FF 0px, transparent 50%),
                radial-gradient(at 100% 100%, #E0F2FE 0px, transparent 50%),
                radial-gradient(at 0% 100%, #F0F9FF 0px, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 132, 199, 0.04) 0%, transparent 60%);
            background-attachment: fixed;
            background-size: 100% 100%;
        }

        /* Subtle grid overlay to give it a structured, medical feel */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(2, 132, 199, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: -1;
        }

        /* Full Browser Container */
        .app-container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
        }

        /* Top Header Icons */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .back-btn:hover { background-color: var(--bg-color); color: var(--text-main); }
        .back-btn svg { width: 20px; height: 20px; }

        .schedule-btn {
            background-color: var(--primary-light);
            color: var(--primary-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .schedule-btn:hover { background-color: #BAE6FD; }
        .schedule-btn svg { width: 14px; height: 14px; }

        .icon-transparent {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .icon-transparent:hover {
            background-color: var(--bg-color);
            border-color: var(--border-hover);
            color: var(--text-main);
        }

        .icon-transparent svg { width: 18px; height: 18px; }

        /* Logout Button Style */
        .logout-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: #FEF2F2; /* Soft red hover */
            color: #DC2626; /* Deep red text */
            border-color: #FECACA;
        }

        .logout-btn svg { width: 14px; height: 14px; }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(145deg, #F0F9FF 0%, #E0F2FE 100%);
            border-radius: var(--radius-lg);
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            border: 1px solid #BAE6FD;
            position: relative;
            overflow: hidden;
        }

        /* Decorative glare inside profile card */
        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
            pointer-events: none;
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 0 4px #FFFFFF, 0 4px 12px rgba(2, 132, 199, 0.15);
            position: relative;
            z-index: 1;
        }

        .avatar-box img {
            width: 75px;
            height: 75px;
            object-fit: cover;
        }

        .name-pill {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
            z-index: 1;
        }

        .patient-name {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            text-transform: capitalize;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }

        .patient-id {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* Timeline Section */
        .timeline-title {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            letter-spacing: -0.01em;
        }

        #timelineContainer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        /* Dynamic History Cards injected by JS */
        .history-card {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--primary);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .history-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .history-card div:nth-child(1) { font-weight: 600; color: var(--text-main); font-size: 15px; }
        .history-card div:nth-child(2) { color: #0F172A; font-weight: 500; font-size: 14px; }
        .history-card div:nth-child(3),
        .history-card div:nth-child(4) { color: var(--text-muted); font-size: 13px; }

        /* Action Buttons Container */
        .actions-container {
            display: flex;
            justify-content: center; /* Centers the button perfectly */
            width: 100%;
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            width: 100%;
            max-width: 320px; /* Constrains width so it doesn't look stretched */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-upload {
            background-color: var(--primary);
            border: 1px solid var(--primary);
            color: white;
            box-shadow: 0px 4px 10px rgba(2, 132, 199, 0.25);
        }

        .btn-upload:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0px 6px 14px rgba(2, 132, 199, 0.3);
        }

        .btn-upload svg { width: 18px; height: 18px; color: white; }

        /* Loading Spinner */
        #loadingScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 400px;
        }

        .spinner {
            border: 3px solid var(--bg-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            .app-container { padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Loading Screen -->
        <div id="loadingScreen">
            <div class="spinner"></div>
            <p style="margin-top: 20px; color: var(--text-muted); font-size: 14px; font-weight: 500;">Loading Profile...</p>
        </div>

        <!-- Main Content (Hidden until data loads) -->
        <div id="mainContent" style="display: none; flex-direction: column; height: 100%;">

            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <button class="back-btn" onclick="window.history.back()" title="Go Back">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button class="schedule-btn" onclick="window.location.href='/doctors'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        Schedule
                    </button>
                </div>
                <div class="header-right">
                    <!-- Home Icon -->
                    <button id="homeBtn" class="icon-transparent" title="Home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </button>
                    <!-- Log Out Button -->
                    <button id="logoutBtn" class="logout-btn" title="Log Out">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Log out
                    </button>
                </div>
            </div>

            <!-- Profile Card -->
            <div class="profile-card">
                <div class="avatar-box">
                    <img src="https://img.icons8.com/color/96/000000/businessman.png" alt="Patient Avatar">
                </div>
                <div class="name-pill">
                    <div id="patientName" class="patient-name">Loading...</div>
                    <div id="patientEmail" class="patient-id">Loading...</div>
                </div>
            </div>

            <!-- Timeline Section -->
            <h2 class="timeline-title">Medical Scan History</h2>
            <div id="timelineContainer">
                <!-- Data will be injected here via JavaScript -->
            </div>

            <!-- Action Buttons Container -->
            <div class="actions-container">
                <a href="/triage" class="action-btn btn-upload">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload an X-ray
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const patientData = localStorage.getItem('loggedInPatient');

            if (!patientData) {
                window.location.replace('/login');
                return;
            }

            const user = JSON.parse(patientData);
            const userEmail = user.email;

            document.getElementById('patientName').textContent = user.full_name;
            document.getElementById('patientEmail').textContent = user.email;

            try {
                const response = await fetch(`/api/patient_profile/${userEmail}`);
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    const timelineContainer = document.getElementById('timelineContainer');
                    const timeline = data.timeline;

                    if (timeline && timeline.length > 0) {
                        let timelineHTML = '';
                        timeline.forEach(scan => {
                            timelineHTML += `
                                <div class="history-card">
                                    <div>X-Ray: ${scan.scan_type}</div>
                                    <div>Detection: ${scan.diagnosis}</div>
                                    <div>AI Confidence: ${scan.confidence}%</div>
                                    <div>Date: ${scan.date}</div>
                                </div>
                            `;
                        });
                        timelineContainer.innerHTML = timelineHTML;
                    } else {
                        timelineContainer.innerHTML = `
                            <div class="history-card" style="text-align: center; justify-content: center; padding: 24px; color: #64748B; border-left: 1px solid #E2E8F0;">
                                No historical scans found yet.
                            </div>
                        `;
                    }

                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'flex';
                } else {
                    localStorage.removeItem('loggedInPatient');
                    window.location.replace('/login');
                }
            } catch (error) {
                console.error("Error fetching profile:", error);
                alert('Network error. Ensure your FastAPI backend is running.');
            }
        });

     document.getElementById('homeBtn').addEventListener('click', () => {
    window.location.href = '/home';
});

        // Logout button functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('loggedInPatient');
            window.location.href = '/';
        });
    </script>
</body>
</html>
