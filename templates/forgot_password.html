<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Triage</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'League Spartan',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        body { background:#F8FAFC; min-height:100vh; display:flex; justify-content:center;
               align-items:center; padding:20px; }
        .container { width:100%; max-width:420px; background:#FFF; border-radius:24px;
                     box-shadow:0 10px 25px rgba(0,0,0,.05); padding:30px 24px; }
        .header { display:flex; align-items:center; justify-content:center; position:relative;
                  margin-bottom:8px; }
        .back-btn { position:absolute; left:0; background:#ECF1FF; border:none; cursor:pointer;
                    font-size:20px; color:#225fff; font-weight:bold; width:36px; height:36px;
                    border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .back-btn:hover { background:#D1DBFF; }
        .header-title { font-weight:600; color:#225fff; font-size:22px; }
        .subtitle { text-align:center; font-size:14px; color:#64748B; margin-bottom:24px;
                    line-height:1.5; }
        .steps { display:flex; gap:8px; margin-bottom:24px; }
        .step { flex:1; height:4px; border-radius:2px; background:#E2E8F0; }
        .step.active { background:#225fff; }
        .form-group { margin-bottom:18px; }
        .form-label { display:block; font-size:14px; font-weight:500; color:#374151; margin-bottom:6px; }
        .form-input { width:100%; background:#ECF1FF; border-radius:14px; border:1px solid transparent;
                      outline:none; font-size:16px; color:#225fff; padding:12px 16px;
                      transition:all .2s; font-family:inherit; }
        .form-input:focus { border-color:#225fff; background:#FFF;
                            box-shadow:0 0 0 3px rgba(34,95,255,.15); }
        #code { letter-spacing:8px; text-align:center; font-size:22px; font-weight:600; }
        .submit-btn { width:100%; height:50px; background:#225fff; border:none; border-radius:25px;
                      color:#fff; font-size:18px; font-weight:600; cursor:pointer;
                      box-shadow:0 4px 12px rgba(34,95,255,.3); margin-top:10px;
                      transition:all .2s; font-family:inherit; }
        .submit-btn:hover:not(:disabled) { background:#1a4ce0; transform:translateY(-1px); }
        .submit-btn:disabled { background:#c5d3ff; cursor:not-allowed; box-shadow:none;
                               transform:none; }
        .msg { border-radius:14px; padding:11px 14px; font-size:14px; margin-bottom:16px;
               display:none; line-height:1.45; }
        .msg.error { background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C; display:block; }
        .msg.info { background:#ECF1FF; border:1px solid #C5D3FF; color:#1a4ce0; display:block; }
        .dev-box { background:#FFF4D6; border:1px solid #F0D48A; color:#8A5A00; border-radius:14px;
                   padding:12px 14px; font-size:13px; margin-bottom:16px; display:none;
                   line-height:1.5; }
        .dev-box b { font-size:20px; letter-spacing:4px; display:block; margin-top:4px; }
        .link-row { text-align:center; margin-top:18px; font-size:14px; color:#64748B; }
        .link-row a { color:#225fff; font-weight:600; text-decoration:none; cursor:pointer; }
        .link-row a:hover { text-decoration:underline; }
        .hint { font-size:12px; color:#94A3B8; margin-top:6px; }
        .success-icon { width:80px; height:80px; border:5px solid #225fff; border-radius:16px;
                        display:flex; justify-content:center; align-items:center;
                        margin:0 auto 20px; color:#225fff; font-size:44px; font-weight:bold; }
        .hidden { display:none !important; }
    </style>
</head>
<body>
<main class="container">

    <header class="header">
        <button type="button" class="back-btn" onclick="goBack()" aria-label="Go back">&lt;</button>
        <h1 class="header-title" id="pageTitle">Reset Password</h1>
    </header>
    <p class="subtitle" id="pageSubtitle">Enter your email and we'll send you a reset code.</p>

    <div class="steps" id="steps">
        <div class="step active" id="step1Bar"></div>
        <div class="step" id="step2Bar"></div>
    </div>

    <div id="message" class="msg"></div>
    <div id="devBox" class="dev-box"></div>

    <!-- STAGE 1 -->
    <section id="stage1">
        <div class="form-group">
            <label class="form-label" for="email">Registered Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email"
                   autocomplete="email">
        </div>

        <!-- Only shown when the server requires no code -->
        <div id="simpleFields" class="hidden">
            <div class="form-group">
                <label class="form-label" for="simplePassword">New Password</label>
                <input type="password" id="simplePassword" class="form-input"
                       placeholder="At least 8 characters" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="simpleConfirm">Repeat New Password</label>
                <input type="password" id="simpleConfirm" class="form-input"
                       placeholder="Re-enter password" autocomplete="new-password">
            </div>
        </div>

        <button type="button" class="submit-btn" id="sendBtn" onclick="stageOneSubmit()">
            Update Password
        </button>
        <div class="link-row"><a href="/login">&larr; Back to Log In</a></div>
    </section>

    <!-- STAGE 2 -->
    <section id="stage2" class="hidden">
        <div class="form-group">
            <label class="form-label" for="code">6-digit code</label>
            <input type="text" id="code" class="form-input" inputmode="numeric" maxlength="6"
                   placeholder="000000" autocomplete="one-time-code">
            <div class="hint">Expires in 15 minutes.</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <input type="password" id="newPassword" class="form-input" placeholder="At least 8 characters"
                   autocomplete="new-password">
        </div>
        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password"
                   autocomplete="new-password">
        </div>
        <button type="button" class="submit-btn" id="resetBtn" onclick="submitReset()">
            Reset password
        </button>
        <div class="link-row">Didn't get it? <a onclick="requestCode()">Send a new code</a></div>
        <div class="link-row"><a href="/login">&larr; Back to Log In</a></div>
    </section>

    <!-- STAGE 3 -->
    <section id="stage3" class="hidden">
        <div class="success-icon">&#10003;</div>
        <p class="subtitle" style="margin-bottom:20px;">
            Your password has been updated. You can log in with it now.
        </p>
        <button type="button" class="submit-btn" onclick="window.location.href='/login'">
            &larr; Back to Log In
        </button>
    </section>

</main>

<script>
    const el = id => document.getElementById(id);
    let currentEmail = '';
    let requiresCode = false;   // set from /api/reset_config on load

    function show(type, text) {
        const m = el('message');
        m.className = 'msg ' + type;
        m.textContent = text;
    }
    function clearMsg() { el('message').className = 'msg'; el('message').textContent = ''; }

    // ---- Decide which flow to render --------------------------------------
    (async function init() {
        try {
            const res = await fetch('/api/reset_config');
            const cfg = await res.json();
            requiresCode = !!cfg.requires_code;
        } catch (e) {
            requiresCode = false;   // fall back to the simpler flow
        }

        if (requiresCode) {
            el('pageSubtitle').textContent = "Enter your email and we'll send you a reset code.";
            el('sendBtn').textContent = 'Send reset code';
        } else {
            // No verification step: everything fits on one screen.
            el('simpleFields').classList.remove('hidden');
            el('steps').classList.add('hidden');
            el('pageSubtitle').textContent = 'Enter your email to update your password.';
            el('sendBtn').textContent = 'Update Password';
        }
    })();

    function goBack() {
        if (!el('stage2').classList.contains('hidden')) {
            el('stage2').classList.add('hidden');
            el('stage1').classList.remove('hidden');
            el('step2Bar').classList.remove('active');
            el('pageSubtitle').textContent = "Enter your email and we'll send you a reset code.";
            el('devBox').style.display = 'none';
            clearMsg();
        } else {
            window.location.href = '/login';
        }
    }

    // ---- Whatever the button does depends on the mode ---------------------
    function stageOneSubmit() {
        if (requiresCode) requestCode();
        else simpleReset();
    }

    // ---- SIMPLE MODE: email + new password, no code -----------------------
    async function simpleReset() {
        const email = el('email').value.trim();
        const pw = el('simplePassword').value;
        const confirm = el('simpleConfirm').value;

        if (!email || !email.includes('@')) { show('error', 'Enter a valid email address.'); return; }
        if (pw.length < 8) { show('error', 'Password must be at least 8 characters.'); return; }
        if (pw !== confirm) { show('error', 'The two passwords do not match.'); return; }

        const btn = el('sendBtn');
        btn.disabled = true;
        btn.textContent = 'Updating...';
        clearMsg();

        try {
            const res = await fetch('/api/reset_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, new_password: pw })
            });
            const data = await res.json();

            if (!res.ok) {
                show('error', data.detail || 'Could not update the password.');
                btn.disabled = false;
                btn.textContent = 'Update Password';
                return;
            }

            el('stage1').classList.add('hidden');
            el('stage3').classList.remove('hidden');
            el('pageTitle').textContent = 'Password Updated';
            el('pageSubtitle').textContent = '';
            clearMsg();
        } catch (e) {
            show('error', 'Could not reach the server.');
            btn.disabled = false;
            btn.textContent = 'Update Password';
        }
    }

    // ---- CODE MODE, stage 1: request a code -------------------------------
    async function requestCode() {
        const email = el('email').value.trim();
        if (!email || !email.includes('@')) { show('error', 'Enter a valid email address.'); return; }

        const btn = el('sendBtn');
        btn.disabled = true;
        btn.textContent = 'Sending...';
        clearMsg();

        try {
            const res = await fetch('/api/forgot_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (!res.ok) {
                show('error', data.detail || 'Something went wrong. Try again.');
                btn.disabled = false;
                btn.textContent = 'Send reset code';
                return;
            }

            currentEmail = email;
            el('stage1').classList.add('hidden');
            el('stage2').classList.remove('hidden');
            el('step2Bar').classList.add('active');
            el('pageTitle').textContent = 'Enter Code';
            el('pageSubtitle').textContent = 'We sent a 6-digit code to ' + email + '.';
            show('info', data.message);

            if (data.dev_code) {
                const box = el('devBox');
                box.innerHTML = 'DEV MODE — code shown because email sending is not '
                              + 'configured yet:<b>' + data.dev_code + '</b>';
                box.style.display = 'block';
                el('code').value = data.dev_code;
            }
            el('code').focus();
        } catch (e) {
            show('error', 'Could not reach the server.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Send reset code';
        }
    }

    // ---- CODE MODE, stage 2: submit code + new password -------------------
    async function submitReset() {
        const code = el('code').value.trim();
        const pw = el('newPassword').value;
        const confirm = el('confirmPassword').value;

        if (code.length !== 6) { show('error', 'Enter the 6-digit code.'); return; }
        if (pw.length < 8) { show('error', 'Password must be at least 8 characters.'); return; }
        if (pw !== confirm) { show('error', 'The two passwords do not match.'); return; }

        const btn = el('resetBtn');
        btn.disabled = true;
        btn.textContent = 'Resetting...';
        clearMsg();

        try {
            const res = await fetch('/api/reset_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail, code, new_password: pw })
            });
            const data = await res.json();

            if (!res.ok) {
                show('error', data.detail || 'Could not reset the password.');
                btn.disabled = false;
                btn.textContent = 'Reset password';
                return;
            }

            el('stage2').classList.add('hidden');
            el('stage3').classList.remove('hidden');
            el('devBox').style.display = 'none';
            el('pageTitle').textContent = 'Password Updated';
            el('pageSubtitle').textContent = '';
            clearMsg();
        } catch (e) {
            show('error', 'Could not reach the server.');
            btn.disabled = false;
            btn.textContent = 'Reset password';
        }
    }

    // Enter key submits whichever stage is visible
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        if (!el('stage1').classList.contains('hidden')) stageOneSubmit();
        else if (!el('stage2').classList.contains('hidden')) submitReset();
    });

    // Digits only in the code field
    el('code').addEventListener('input', e => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });
</script>
</body>
</html>
