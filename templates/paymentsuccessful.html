<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - AI Triage</title>

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #2563EB;
            --brand-blue-hover: #1D4ED8;
            --success-green: #10B981;
            --success-green-light: #D1FAE5;

            --bg-color: #FFFFFF;

            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;

            --border-color: #E2E8F0;

            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* Web Page Header Navigation */
        .page-header {
            width: 100%;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .back-button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: var(--text-main);
        }

        /* Main Content Container centered on the page */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .content-container {
            width: 100%;
            max-width: 540px; /* Constrains width for web */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Pulsing Success Icon */
        .success-icon-box {
            width: 88px;
            height: 88px;
            background: var(--success-green-light);
            color: var(--success-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .success-icon-box::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--success-green-light);
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .check-mark {
            font-size: 40px;
            font-weight: 800;
        }

        /* Typography */
        .title-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        /* Details Section Layout */
        .details-wrapper {
            width: 100%;
            margin-bottom: 40px;
        }

        .booking-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .doctor-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 32px;
        }

        .date-time-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin-bottom: 32px;
        }

        .date-time-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #F8FAFC;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .icon-placeholder {
            color: var(--brand-blue);
            display: flex;
            align-items: center;
        }

        .date-time-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Receipt Information */
        .receipt-container {
            width: 100%;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .receipt-row:last-child {
            margin-bottom: 0;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        .receipt-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .receipt-value {
            color: var(--text-main);
            font-weight: 600;
        }

        .receipt-value.highlight {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
        }

        /* Action Button */
        .home-action-btn {
            background: var(--brand-blue);
            color: #FFF;
            border: none;
            border-radius: var(--radius-sm);
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 300px;
        }

        .home-action-btn:hover {
            background: var(--brand-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.2);
        }

        /* Footer */
        .footer-note {
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
            padding: 24px;
        }

        @media (max-width: 600px) {
            .page-header { padding: 20px; }
            .date-time-container { grid-template-columns: 1fr; }
            .title-text { font-size: 28px; }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <button class="back-button" onclick="window.location.href='/home'" aria-label="Go back">
            <span style="font-size: 18px;">&larr;</span> Back to Dashboard
        </button>
    </header>

    <div class="main-wrapper">
        <div class="content-container">

            <div class="success-icon-box"><span class="check-mark">&#10003;</span></div>
            <h2 id="titleText" class="title-text">Confirming...</h2>
            <p id="subtitleText" class="subtitle-text">Please wait while we verify your payment</p>

            <div class="details-wrapper">
                <p class="booking-text">Appointment Confirmed For</p>
                <h3 id="doctorNameText" class="doctor-name">—</h3>

                <div class="date-time-container">
                    <div class="date-time-box">
                        <div class="icon-placeholder">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        </div>
                        <span id="dateText" class="date-time-text">--</span>
                    </div>
                    <div class="date-time-box">
                        <div class="icon-placeholder">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <span id="timeText" class="date-time-text">--</span>
                    </div>
                </div>

                <div id="receipt" class="receipt-container" style="display:none;">
                    <div class="receipt-row">
                        <span class="receipt-label">Transaction ID</span>
                        <span class="receipt-value" id="orderText" style="font-family: monospace;">—</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Payment Method</span>
                        <span class="receipt-value" id="methodText">—</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Total Paid</span>
                        <span class="receipt-value highlight" id="amountText">—</span>
                    </div>
                </div>
            </div>

            <button class="home-action-btn" onclick="window.location.href='/home'">Return to Home</button>
        </div>
    </div>

    <div class="footer-note">
        Secure Checkout processed by AI Triage
    </div>

    <script>
        const orderId = new URLSearchParams(location.search).get('order_id');

        (async function () {
            if (!orderId) {
                document.getElementById('titleText').textContent = 'No payment found';
                document.getElementById('subtitleText').textContent = 'We could not locate a transaction reference.';
                return;
            }
            try {
                let res = await fetch(`/api/payments/${orderId}`);
                if (!res.ok) throw new Error('lookup failed');
                let p = (await res.json()).payment;

                if (p.status === 'pending') {
                    try {
                        await fetch(`/api/payments/${orderId}/recheck`, { method: 'POST' });
                        res = await fetch(`/api/payments/${orderId}`);
                        p = (await res.json()).payment;
                    } catch (e) { /* fall through */ }
                }

                if (p.status !== 'paid') {
                    document.getElementById('titleText').textContent = 'Payment not completed';
                    document.getElementById('subtitleText').textContent =
                        p.fail_reason || (p.status === 'pending'
                            ? 'Payment not confirmed yet. Check your dashboard shortly.'
                            : 'This booking has not been paid for.');
                    document.getElementById('doctorNameText').textContent = p.doctor_name || '—';
                    return;
                }

                // Populate success data
                document.getElementById('titleText').textContent = 'Payment Successful';
                document.getElementById('subtitleText').textContent = 'Your appointment has been confirmed.';
                document.getElementById('doctorNameText').textContent = p.doctor_name;
                document.getElementById('dateText').textContent = p.appt_date;
                document.getElementById('timeText').textContent = p.appt_time;
                document.getElementById('amountText').textContent = p.currency + ' ' + Number(p.amount).toFixed(2);
                document.getElementById('methodText').textContent = p.method === 'BKASH' ? 'bKash' : (p.method || 'Card');
                document.getElementById('orderText').textContent = p.order_id;

                document.getElementById('receipt').style.display = 'block';

                sessionStorage.removeItem('appointmentId');
            } catch (e) {
                document.getElementById('titleText').textContent = 'Could not confirm';
                document.getElementById('subtitleText').textContent = 'Please check your appointments on the dashboard before booking again.';
            }
        })();
    </script>
</body>
</html>
