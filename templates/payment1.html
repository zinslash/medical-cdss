<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Method - AI Triage</title>

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           GLOBAL VARIABLES & PALETTE
           ========================================= */
        :root {
            --bg-color: #F4F7FB;
            --app-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;

            --primary: #0284C7;
            --primary-hover: #0369A1;
            --primary-light: #E0F2FE;
            --primary-soft: #F0F9FF;

            --border: #E2E8F0;
            --border-hover: #CBD5E1;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 12px 24px -4px rgb(0 0 0 / 0.04), 0 4px 8px -4px rgb(0 0 0 / 0.03);

            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;

            --bkash-pink: #E2136E;
        }

        /* =========================================
           GLOBAL STYLES (FULL PAGE NATURAL FLOW)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;

            /* AMBIENT MESH BACKGROUND spans the whole body natively */
            background-image:
                radial-gradient(at 0% 0%, #E0F2FE 0px, transparent 50%),
                radial-gradient(at 100% 0%, #F0F9FF 0px, transparent 50%),
                radial-gradient(at 100% 100%, #E0F2FE 0px, transparent 50%),
                radial-gradient(at 0% 100%, #F0F9FF 0px, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 132, 199, 0.04) 0%, transparent 60%);
            background-attachment: fixed;
            background-size: 100% 100%;
        }

        /* Subtle grid overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: -1;
        }

        /* Central web layout wrapper */
        .page-wrapper {
            width: 100%;
            max-width: 720px; /* Centered, comfortable reading width for checkout */
            margin: 0 auto;
            padding: 60px 24px 80px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* =========================================
           HEADER
           ========================================= */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            position: relative;
        }

        .back-button {
            background: var(--app-bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            position: absolute;
            left: 0;
        }

        .back-button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .back-button svg { width: 18px; height: 18px; }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            width: 100%;
            letter-spacing: -0.01em;
        }

        /* =========================================
           DASHBOARD PANEL
           ========================================= */
        .dashboard-panel {
            background-color: var(--app-bg);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }

        /* =========================================
           PAYMENT OPTIONS
           ========================================= */
        .option-card {
            background-color: var(--app-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            padding: 20px 24px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: left;
            box-shadow: var(--shadow-sm);
        }

        .option-card:hover:not(.active) {
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .option-card.active {
            border-color: var(--primary);
            background-color: var(--primary-soft);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
        }

        .icon-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-card {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .icon-bkash {
            background-color: #FCE4EC; /* Soft pink background */
            color: var(--bkash-pink);
        }

        .icon-placeholder svg {
            width: 20px;
            height: 20px;
        }

        .option-text {
            flex: 1;
            font-size: 16px;
            color: var(--text-main);
            font-weight: 600;
        }

        .option-card.active .option-text {
            color: var(--primary);
        }

        /* Custom Radio Button */
        .radio-outer {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-hover);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            background: var(--app-bg);
        }

        .option-card.active .radio-outer {
            border-color: var(--primary);
        }

        .radio-inner {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--primary);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card.active .radio-inner {
            opacity: 1;
            transform: scale(1);
        }

        /* =========================================
           NOTES & ERROR BOX
           ========================================= */
        .security-note {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background-color: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin: 32px 0;
        }

        .security-note svg {
            color: var(--text-muted);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .note {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 500;
        }

        .error-box {
            margin-bottom: 24px;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            box-shadow: var(--shadow-sm);
        }

        /* =========================================
           CONTINUE BUTTON
           ========================================= */
        .continue-btn {
            width: 100%;
            background-color: var(--primary);
            border: none;
            border-radius: var(--radius-sm);
            height: 60px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0px 8px 16px rgba(2, 132, 199, 0.25);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.01em;
        }

        .continue-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0px 12px 24px rgba(2, 132, 199, 0.3);
        }

        .continue-btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* =========================================
           RESPONSIVE DESIGN
           ========================================= */
        @media (max-width: 600px) {
            .page-wrapper { padding: 30px 16px; }
            .dashboard-panel { padding: 24px 20px; }
            .header-title { font-size: 20px; }
            .back-button span { display: none; } /* Hide text on small screens, keep icon */
        }
    </style>
</head>
<body>

    <main class="page-wrapper">
        <header class="header">
            <button onclick="window.history.back()" class="back-button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                <span>Back</span>
            </button>
            <h1 class="header-title">Payment Method</h1>
        </header>

        <div class="dashboard-panel">
            <div id="errorBox" class="error-box"></div>

            <h2 class="section-title">Choose how to pay</h2>

            <div class="option-card active" data-id="card" onclick="selectPayment('card')">
                <div class="icon-placeholder icon-card">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                </div>
                <span class="option-text">Credit / Debit Card</span>
                <div class="radio-outer"><div class="radio-inner"></div></div>
            </div>

            <div class="option-card" data-id="bkash" onclick="selectPayment('bkash')">
                <div class="icon-placeholder icon-bkash">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </div>
                <span class="option-text">bKash</span>
                <div class="radio-outer"><div class="radio-inner"></div></div>
            </div>

            <div class="security-note">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <p class="note">
                    Your card or bKash details are entered on the payment provider's own secure page.
                    They are never sent to or stored by AI Triage.
                </p>
            </div>

            <button id="continueBtn" class="continue-btn" onclick="startPayment()">
                Continue to secure payment
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </div>
    </main>

    <!-- JavaScript Logic (UNTOUCHED) -->
    <script>
        let selected = 'card';
        const errorBox = document.getElementById('errorBox');
        const btn = document.getElementById('continueBtn');

        // Surface any error handed back by /payment/return
        const err = new URLSearchParams(location.search).get('error');
        if (err) { errorBox.textContent = err; errorBox.style.display = 'block'; }

        function selectPayment(id) {
            selected = id;
            document.querySelectorAll('.option-card').forEach(c =>
                c.classList.toggle('active', c.dataset.id === id));
        }

        async function startPayment() {
            const appointmentId = sessionStorage.getItem('appointmentId');
            const token = localStorage.getItem('authToken');

            if (!appointmentId) {
                errorBox.textContent = 'No appointment to pay for. Please book one first.';
                errorBox.style.display = 'block';
                return;
            }
            if (!token) { window.location.href = '/login'; return; }

            btn.disabled = true;
            btn.textContent = 'Starting payment...';
            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/payments/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ appointment_id: Number(appointmentId) })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorBox.textContent = data.detail || 'Could not start payment.';
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Continue to payment';
                    return;
                }
                // Hand off to the provider's hosted page.
                window.location.href = data.checkout_url;
            } catch (e) {
                errorBox.textContent = 'Network error. Please try again.';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Continue to payment';
            }
        }
    </script>
</body>
</html>
